server:
  port: 8001

spring:
  application:
    name: user-service

  config:
    import: "optional:configserver:"

  # Database Configurations
  datasource:
    url: jdbc:mysql://localhost:3306/saga_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect